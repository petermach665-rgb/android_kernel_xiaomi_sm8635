name: NetHunter peridot (SM8635) - KSUN + SUSFS + NetHunter (+DroidSpaces/LXC)

# KMI gate: baseline MUST come from the SAME tree+flavor+defconfig+fragment+toolchain.
# The defconfig is the EXACT config of the running crDroid 16.0 kernel
# (peridot-stock_defconfig, captured from /proc/config.gz).
# The toolchain is the EXACT AOSP clang the ROM was built with (r563880c).
#
# vendor_dlkm: the stock prebuilt /vendor_dlkm modules carry CRCs from the ROM's
# own build and refuse to load against our Image ("disagrees about version of
# symbol _dev_err", see manual §12.14). Ticking 'vendor_dlkm' also produces
# dist/vendor_dlkm-<flavor>.img from the modules this tree builds, so Image and
# modules come from one tree+config+toolchain. Flash BOTH.
#
# NOTE: the produced image is NOT AVB-signed (we have no ROM key). It only boots
# if the device's vbmeta has verity/verification disabled for vendor_dlkm
# (fastboot --disable-verity --disable-verification flash vbmeta ...), or if the
# bootloader is unlocked and does not enforce dm-verity on that partition.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'baseline = build selected flavor to capture its KMI symvers'
        required: true
        default: 'build'
        type: choice
        options: [build, baseline]
      flavor:
        description: 'Root flavor from scripts/ci/build-flavor.sh'
        required: true
        default: 'ksun-susfs-droidspaces'
        type: choice
        options:
          - plain
          - ksun-plain
          - ksun-susfs
          - ksun-susfs-droidspaces
          - sukisu-susfs
          - resukisu-susfs
          - premium
      ksu_tag:
        description: 'KernelSU-Next tag override (e.g. v3.4.1); empty = pins.env default'
        required: false
        default: ''
      vendor_dlkm:
        description: 'Also build dist/vendor_dlkm-<flavor>.img (flash with boot)'
        type: boolean
        default: false
      release:
        description: 'Publish a prerelease with the zips'
        type: boolean
        default: false

concurrency:
  group: nethunter-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.flavor }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NET_VERSION: "1.0"
  KBUILD_BUILD_USER: build
  KBUILD_BUILD_HOST: localhost
  AOSP_CLANG_URL: "https://github.com/kiy017/clang-r563880c/releases/download/release/linux-x86-f8439f0628d799092dd07df440a6334cab28939c-clang-r563880c.tar.gz"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    name: nethunter-${{ inputs.mode }}-${{ inputs.flavor }}-${{ inputs.ksu_tag || 'pin' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fix script permissions
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -exec chmod +x {} \;
          chmod +x scripts/ci/build-flavor.sh scripts/ci/build-vendor-dlkm.sh scripts/ci/symvers-diff.sh 2>/dev/null || true
          ls -l scripts/ci/build-flavor.sh scripts/ci/build-vendor-dlkm.sh

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex build-essential libssl-dev libncurses-dev libelf-dev zlib1g-dev pkg-config git curl zip cpio kmod python3 ccache lld llvm dwarves zstd rsync wget e2fsprogs
          sudo apt-get install -y --no-install-recommends android-sdk-libsparse-utils || echo 'img2simg not available, will keep raw ext4'

      - name: Free disk + swap headroom
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h && df -h /

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.ccache
          key: ccache-nethunter-${{ inputs.mode }}-${{ inputs.flavor }}-${{ inputs.ksu_tag || 'pin' }}-${{ github.sha }}
          restore-keys: |
            ccache-nethunter-

      - name: AOSP clang r563880c (matches ROM toolchain)
        run: |
          set -euo pipefail
          cd "$HOME"
          rm -rf clang clang-dl; mkdir -p clang-dl
          curl -fsSL --retry 5 --retry-delay 15 -o clang-dl/clang.tar.gz "${AOSP_CLANG_URL}"
          ls -la clang-dl/clang.tar.gz
          tar -xzf clang-dl/clang.tar.gz -C clang-dl
          CLANG_BIN=$(find clang-dl -type f -path '*/bin/clang' | head -1)
          [ -n "$CLANG_BIN" ] || { echo "::error::clang not found in AOSP tarball"; exit 1; }
          CLANG_ROOT=$(dirname "$(dirname "$CLANG_BIN")")
          mv "$CLANG_ROOT" "$HOME/clang"
          rm -rf clang-dl
          "$HOME/clang/bin/clang" --version | head -1

      - name: KSUN tag override (optional)
        if: ${{ inputs.ksu_tag != '' }}
        run: |
          set -euo pipefail
          KSU="${{ inputs.ksu_tag }}"
          echo "Overriding KSUN_TAG -> $KSU"
          sed -i "s|^KSUN_TAG=.*|KSUN_TAG=$KSU|" scripts/ci/pins.env
          grep '^KSUN_TAG=' scripts/ci/pins.env
          git ls-remote --tags https://github.com/KernelSU-Next/KernelSU-Next "refs/tags/$KSU" | grep -q . || { echo "::error::tag $KSU not found upstream"; exit 1; }

      - name: Merge NetHunter fragment into peridot-stock_defconfig
        run: |
          set -euo pipefail
          CFG=arch/arm64/configs/peridot-stock_defconfig
          cp "$CFG" "$CFG.orig"
          {
            echo ''
            echo '# === Kali NetHunter fragment (auto-merged by CI) ==='
            grep -vE '^\s*#|^\s*$' arch/arm64/configs/nethunter.fragment
          } >> "$CFG"
          echo "fragment lines appended: $(grep -cE '^CONFIG_' arch/arm64/configs/nethunter.fragment)"

      - name: Build BASELINE (selected flavor, KMI gate off)
        if: ${{ inputs.mode == 'baseline' }}
        env:
          ZIP_VERSION: ${{ env.NET_VERSION }}
          ALLOW_DIRTY: "1"
          ALLOW_OTHER_CLANG: "1"
          KMI_STRICT: "0"
          DEFCONFIG: peridot-stock_defconfig
        run: |
          set -euo pipefail
          export CLANG_DIR="$HOME/clang"
          mkdir -p /tmp/kmi-aside
          mv -f "scripts/ci/kmi-baseline/${{ inputs.flavor }}.symvers" /tmp/kmi-aside/ 2>/dev/null || true
          echo '::notice::baseline mode - capturing Module.symvers for this tree+flavor+defconfig+fragment+toolchain'
          bash scripts/ci/build-flavor.sh "${{ inputs.flavor }}"

      - name: Build flavor (KMI gate ON)
        if: ${{ inputs.mode != 'baseline' }}
        env:
          ZIP_VERSION: ${{ env.NET_VERSION }}
          ALLOW_DIRTY: "1"
          ALLOW_OTHER_CLANG: "1"
          KMI_STRICT: "1"
          DEFCONFIG: peridot-stock_defconfig
        run: |
          set -euo pipefail
          export CLANG_DIR="$HOME/clang"
          export ZIP_PREFIX="NetHunter"
          bash scripts/ci/build-flavor.sh "${{ inputs.flavor }}"

      - name: Build vendor_dlkm image
        if: ${{ inputs.vendor_dlkm && inputs.mode != 'baseline' }}
        env:
          OUT: out
          DIST: dist
          SPARSE: "1"
          STOCK_MODULE_COUNT: "401"
        run: |
          set -euo pipefail
          export CLANG_DIR="$HOME/clang"
          export PATH="$HOME/clang/bin:$PATH"
          echo '::notice::packing the modules built by the previous step into vendor_dlkm.img'
          bash scripts/ci/build-vendor-dlkm.sh "${{ inputs.flavor }}"

      - name: Config evidence
        if: always()
        run: |
          echo '--- clang used ---'
          "$HOME/clang/bin/clang" --version | head -1 || true
          echo '--- NetHunter .config ---'
          grep -E '^CONFIG_(CFG80211|MAC80211|ATH9K|RTL8XXXU|RT2800USB|MT7601U|USB_CONFIGFS|USB_F_HID|USB_SERIAL|NFS_FS|TUN)=' out/.config 2>/dev/null | sort || echo 'no .config'
          echo '--- DroidSpaces / namespace .config ---'
          grep -E '^CONFIG_(SYSVIPC|PID_NS|USER_NS|DEVTMPFS|NF_CT_NETLINK|IP6_NF_NAT|VETH|BRIDGE|OVERLAY_FS|CGROUP_DEVICE|CGROUP_PIDS)=' out/.config 2>/dev/null | sort || echo 'no .config'
          echo '--- CC_VERSION_TEXT ---'
          grep -E '^CONFIG_CC_VERSION_TEXT' out/.config 2>/dev/null || echo 'no .config'
          echo '--- KMI gate summary ---'
          cat out/kmi-summary.txt 2>/dev/null || echo 'no kmi-summary'
          echo '--- vendor_dlkm image ---'
          ls -la dist/vendor_dlkm-*.img 2>/dev/null || echo 'no vendor_dlkm image'

      - name: Upload baseline symvers
        if: ${{ inputs.mode == 'baseline' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kmi-baseline-${{ inputs.flavor }}
          path: |
            dist/Module.symvers-${{ inputs.flavor }}
            dist/config-${{ inputs.flavor }}
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nethunter-kernel
          path: |
            dist/*.zip
            dist/Image-*
            dist/Module.symvers-*
            dist/config-*
            dist/vendor_dlkm-*
            out/build.log
            out/kmi-diff.txt
            out/kmi-summary.txt
          if-no-files-found: warn

  release:
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.mode != 'baseline' && inputs.release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nethunter-kernel
          path: zips
      - run: ls -lh zips/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: nethunter-${{ env.NET_VERSION }}-${{ github.run_number }}
          prerelease: true
          make_latest: false
          name: NetHunter peridot ${{ env.NET_VERSION }} build #${{ github.run_number }}
          body: |
            NetHunter-flavored peridot kernel (KSUN + SUSFS + NetHunter config).
            ksun-susfs-droidspaces / premium flavors add Docker/LXC container support.
            Built from peridot-stock_defconfig with the AOSP clang r563880c toolchain.
            KMI-gated against this tree's own per-flavor baseline.
            If a vendor_dlkm-*.img is present, flash it together with the boot image.
            Flash with backup + fastboot recovery ready.
          files: zips/*.zip
